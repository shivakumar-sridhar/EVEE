[project]
name = "vtp"
version = "0.1.0"
description = "Natural language -> parametric CAD -> sliced G-code -> Ender 3 print, via MCP tools"
requires-python = ">=3.12,<3.15"
dependencies = [
    "build123d>=0.9",
    "trimesh>=4.0",
    "matplotlib>=3.8",
    "numpy>=1.26",
    "pydantic>=2.7",
]

# Later phases (do not add until that phase starts):
#   Phase 3 printer.py -> httpx
#   Phase 4 extract.py -> ollama
#   Phase 5 server.py  -> mcp

[dependency-groups]
dev = ["pytest>=8.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/vtp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "slow: geometry export / rendering tests (deselect with '-m \"not slow\"')",
]
