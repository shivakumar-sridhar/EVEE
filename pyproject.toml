[project]
name = "vtp"
version = "0.1.0"
description = "Natural language -> parametric CAD -> sliced G-code -> Ender-3 V3 SE print, via MCP tools"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.12,<3.15"
dependencies = [
    "build123d>=0.9",
    "trimesh>=4.0",
    "matplotlib>=3.8",
    "numpy>=1.26",
    "pydantic>=2.7",
    "mcp>=2.0",
    # printer.py. `mcp` already pulls httpx2 in, but depending on a transitive dep
    # is depending on someone else's requirements file — name it here as well.
    "httpx2>=2.0",
]

# There are deliberately no optional dependencies. There was a `voice` extra —
# claude-agent-sdk, faster-whisper, piper-tts, sounddevice — for a microphone frontend
# that lived in src/vtp/voice/. It worked, and it was removed: the MCP client already
# has speech input, and reimplementing it here bought nothing the gates did not already
# guarantee. Speak to your client; the server never learns how the words arrived.

[dependency-groups]
dev = ["pytest>=8.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/vtp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "slow: geometry export / rendering tests (deselect with '-m \"not slow\"')",
]
