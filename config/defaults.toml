# House defaults. This file is the source of truth for anything a template
# leaves unspecified. Tuning the physical fit of a printed part happens HERE,
# not in the geometry code.

[geometry]
wall = 2.0        # mm
fillet = 1.0      # mm, vertical edges
lip_height = 3.0  # mm, how deep a press-fit lid lip engages the cavity

[standoff]
# Posts rising from the cavity floor that a PCB rests on, screws into, or both.
# hole_diameter is a PILOT for a self-tapping screw cutting its own thread in
# plastic — not a clearance hole. 2.1mm suits an M2.5 self-tapper, which is what
# Adafruit-sized breakouts take; 1.7mm suits M2. Set hole_diameter = 0 for a
# plain spacer that only lifts and locates the board.
#
# If a printed boss splits when the screw goes in, raise diameter. If the screw
# spins without biting, lower hole_diameter. Both are tuned HERE.
diameter = 4.0
height = 3.0
hole_diameter = 2.1

[clearance]
# Gap per side between lid lip and cavity wall. If a printed lid is too tight,
# raise press_fit and reprint; too loose, lower it. No code change needed.
press_fit = 0.25  # snug — the default
snug = 0.2
easy = 0.3

[export]
stl_linear_tolerance = 0.05   # mm
stl_angular_tolerance = 0.1   # radians

[viewer]
# Gate 1 is a shape check, and a still image is a poor way to make it — you cannot
# see a port on the far wall. design_part opens the exported STLs here instead.
# Exported paths are appended to `command` as trailing arguments.
#
# Set auto_open = false for a headless box or a remote MCP client; the design still
# succeeds and still writes preview PNGs, it just does not pop a window.
#
# PrusaSlicer is the review app for both gates. It shows the part on the real
# 220x220 bed at true scale, which is the thing a generic mesh viewer cannot do:
# "does this fit, and which way up does it print" is answered at a glance.
#
#   --load {profile}   apply the verified profile to the GUI session, so the
#                      export button in the UI cannot reach for a stock profile
#                      that lacks M420 S1.
#
# --single-instance was here and has been REMOVED. It forwarded each new design
# into the existing window's scene and never cleared it, so four objects from two
# designs ended up stacked on the origin. It also made the launched process hand
# over its arguments and exit immediately, which left no pid to close later.
# viewer.py now closes the window it opened last and starts a fresh one, which
# needs our own pid to be the window's pid. Do not add the flag back.
#
# {profile} expands to the absolute path of [slicing].profile. Use the token
# rather than a literal path: an MCP client launches the server from any working
# directory, so a relative path here would resolve somewhere unexpected.
#
# On a machine with no PrusaSlicer datadir the first launch shows the config
# wizard, which blocks the window; add --datadir <dir> to point at a prepared one.
#
# Lightweight alternative, if you want a plain mesh viewer with no bed and no
# slicer attached (apt install f3d):
#   command = ["f3d", "--up=+Z", "--axis", "--grid"]
command = ["prusa-slicer", "--load", "{profile}"]
auto_open = true

# Gate 2. Slicing itself is headless and always has been — `--export-gcode` runs
# captured, because under stdio transport its progress output would land on the
# JSON-RPC stream. This is only about the separate toolpath *window* afterwards.
#
# Off by default: once the shape is approved at Gate 1, the layer count, gram
# weight and time estimate that slice_part returns are what tell you the slice is
# sane. That is how the Phase 2 acceptance was verified (55 layers, 4.25 g,
# 30m44s) without anyone opening this.
#
# Set true to eyeball toolpaths before each print. It is tracked like the model
# viewer, so it replaces its own window rather than stacking them.
gcode_command = ["prusa-gcodeviewer"]
gcode_auto_open = false

[slicing]
# The one hand-tuned, physically verified profile. Slicing never generates a config
# and the MCP tool exposes no way to choose a different one — see slicer.py.
profile = "config/ender3_v3se.ini"
timeout_seconds = 600

[printer]
# OctoPrint on the Pi. The URL and the API key are NOT here: this file is committed
# and the key is a secret. Both live in .env at the repo root — see .env.example.
#
# printer.py reads that file itself rather than trusting os.environ, for the same
# reason viewer.py discovers DISPLAY from disk: an MCP client spawns this server
# with a scrubbed environment (HOME, LOGNAME, PATH, SHELL, TERM, USER and nothing
# else), so a key exported in your shell does not reach the server.
#
# A status GET is a couple of hundred bytes and should answer immediately; a slow
# reply means the Pi is busy driving serial, so keep this short and let it fail.
timeout_seconds = 10

# Uploads are a different shape of request: the Phase 2 G-code is ~320 KB going to
# a Pi over wifi, and the Pi writes it to an SD card before replying.
upload_timeout_seconds = 120
